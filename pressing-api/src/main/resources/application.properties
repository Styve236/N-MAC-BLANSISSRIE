spring.application.name=pressing-api

# Connexion MySQL (adapte selon ta config Laragon)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pressing_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Pool de connexions : max-lifetime inferieur au wait_timeout de MySQL pour eviter
# les connexions killed cote serveur ("Failed to validate connection ... connection closed")
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.idle-timeout=600000

# Hibernate -  jour les tables automatiquement en dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evite le probleme N+1 : les collections lazy (lignes, photos, paiements) sont chargees par lots
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Port du serveur
server.port=8081

# Upload fichiers (photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
photo.upload.dir=uploads/commandes

# JWT — les durees sont en SECONDES (24 h pour l'acces, 30 jours pour le refresh).
# En production, surcharger JWT_SECRET / JWT_EXPIRATION via variables d'environnement.
jwt.secret=${JWT_SECRET:dev_secret_pressing_32_caracteres_minimum_2026}
jwt.expiration=${JWT_EXPIRATION:86400}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000}

# Comptes de demonstration crees au demarrage (admin@press.com/admin123...).
# DESACTIVES par defaut : activer explicitement en developpement local.
app.initializer.actif=${APP_INITIALIZER_ACTIF:false}

# Securite — "development" autorise la cle JWT de developpement, "production" refuse
# de demarrer tant que JWT_SECRET n'est pas defini. L'API refuse aussi de demarrer
# avec la cle par defaut si le profil "prod" est actif.
app.security.mode=${APP_SECURITY_MODE:development}

# Origines autorisees a appeler l'API (le proxy Angular evite ca en dev)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Reverse proxy (Nginx, IIS, Apache) : mettre "framework" pour que l'API lise
# X-Forwarded-For / X-Forwarded-Proto. Ne le faire que derriere un proxy de confiance :
# en acces direct, ces en-tetes sont forgeables par le client.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# Le limiteur de tentatives ne lit X-Forwarded-For que si ce reverse proxy est declare.
app.rate-limit.proxy-de-confiance=${RATE_LIMIT_PROXY_CONFIANCE:false}

# Pagination par défaut
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# SMS (mode console = envoi simulation dans les logs, sans clé API)
sms.enabled=true
sms.mode=console
sms.api-key=
sms.endpoint=
sms.sender=
sms.nom-pressing=N-MAC BLANCHISSERIE
# Suit automatiquement le port reel du serveur (evite les liens de recus casses)
sms.recu-base-url=${SMS_RECU_BASE_URL:http://localhost:${server.port:8080}}

# Documentation OpenAPI / Swagger UI (springdoc v3)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Documenter uniquement les controleurs REST (exclut les endpoints techniques)
springdoc.packages-to-scan=com.pressing.pressing.api.controller
# Trier les endpoints par methode HTTP et les sections par ordre alphabetique
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Confort d'utilisation : essai direct depuis le navigateur + token conserve au rechargement
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none