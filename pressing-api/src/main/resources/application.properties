spring.application.name=pressing-api

# Connexion MySQL (adapte selon ta config Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/pressing_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate -  jour les tables automatiquement en dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port du serveur
server.port=8081

# Upload fichiers (photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
photo.upload.dir=uploads/commandes

# JWT
jwt.secret=CHANGE_MOI_avec_une_longue_chaine_aleatoire_dau_moins_32_caracteres_pour_la_securite
jwt.expiration=86400
jwt.refresh-expiration=2592000000

# Pagination par défaut
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# SMS (mode console = envoi simulation dans les logs, sans clé API)
sms.enabled=true
sms.mode=console
sms.api-key=
sms.endpoint=
sms.sender=
sms.nom-pressing=N-MAC BLANCHISSERIE
sms.recu-base-url=http://localhost:8080

# Documentation OpenAPI / Swagger UI (springdoc v3)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Documenter uniquement les controleurs REST (exclut les endpoints techniques)
springdoc.packages-to-scan=com.pressing.pressing.api.controller
# Trier les endpoints par methode HTTP et les sections par ordre alphabetique
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Confort d'utilisation : essai direct depuis le navigateur + token conserve au rechargement
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none