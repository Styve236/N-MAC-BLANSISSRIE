spring.application.name=pressing-api

# Connexion MySQL (adapte selon ta config Laragon)
spring.datasource.url=jdbc:mysql://localhost:3306/pressing_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate -  jour les tables automatiquement en dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Port du serveur
server.port=8080

# Upload fichiers (photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
photo.upload.dir=uploads/commandes

# JWT
jwt.secret=CHANGE_MOI_avec_une_longue_chaine_aleatoire_dau_moins_32_caracteres_pour_la_securite
jwt.expiration=86400000

# SMS (mode console = envoi simulé dans les logs, sans clé API)
sms.enabled=true
sms.mode=console
sms.api-key=
sms.endpoint=
sms.sender=
sms.nom-pressing=Mon Pressing
sms.recu-base-url=http://localhost:8080